[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-content-quality-auditor"
version = "1.0.0"
description = "The quality gate between crawling and RAG ingestion."
requires-python = ">=3.12"
dependencies = ["apify==3.4.1", "httpx==0.28.1", "beautifulsoup4==4.15.0", "protego==0.7.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "jsonschema>=4.23,<5", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["my_actor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
