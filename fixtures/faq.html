<html><head><title>FAQ: source documents</title></head><body><main><h1>Frequently asked questions</h1><h2>What is an audit?</h2><p>An audit identifies measurable properties of your source content before ingestion.</p><h2>Are tokens exact?</h2><p>No. Token counts are estimates that vary with the language and the tokenizer used by your embedding system.</p></main></body></html>
